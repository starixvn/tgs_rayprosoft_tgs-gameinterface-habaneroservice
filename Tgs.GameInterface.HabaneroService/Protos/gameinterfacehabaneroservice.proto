syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.HabaneroService.Protos";

package GameInterfaceHabaneroService;

// The greeting service definition.
service  GameInterfaceHabaneroService{
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);  
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (FundStatusReply);
  rpc GameHistorySettled (GameHistorySettledRequest) returns (GameHistorySettledReply);  
  rpc GameToken (GameTokenRequest) returns (GameTokenReply);
}

// The request message containing the user's name.
message FundRequest {
	string api_url = 1;
	string brand_id = 2;
	string api_key = 3;
	string username = 4;
	string password = 5;
	string currency_code = 6;
	phoenix.protobuf.DecimalValue amount = 7;
	string transaction_id = 8;
}

message FundStatusRequest {
	string api_url = 1;
	string brand_id = 2;
	string api_key = 3;
	string username = 4;
	string transaction_id = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string brand_id = 2;
	string api_key = 3;
	string username = 4;
	string password = 5;
}

message PlayerCreateRequest {
	string api_url = 1;
	string brand_id = 2;
	string api_key = 3;
	string player_host_address = 4;
	string user_agent = 5;
	string username = 6;
	string password = 7;
	string currency_code = 8;
}

message GameHistorySettledRequest {
	string api_url = 1;	
	string brand_id = 2;
	string api_key = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;	
}

message GameTokenRequest {
	string api_url = 1;
	string brand_id = 2;
	string api_key = 3;
	string player_host_address = 4;
	string user_agent = 5;
	string username = 6;
	string password = 7;
	string currency_code = 8;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {	
    string transaction_id = 1;
    phoenix.protobuf.DecimalValue balance = 2; 
}

message FundStatusReply {
	bool is_order_exist = 1;
}

message GameHistorySettledReply {
	repeated GameHistorySettled items = 1;
}

message GameHistorySettled {
    string player_code = 1;
    string external_round_id = 2;
    string external_game_id = 3;    
	google.protobuf.Timestamp external_created_on = 4;
	google.protobuf.Timestamp external_closed_on = 5;
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue valid_bet = 7;
	phoenix.protobuf.DecimalValue player_win_loss = 8;
	phoenix.protobuf.DecimalValue turnover = 9;
	phoenix.protobuf.DecimalValue settle = 10;    
}

message GameTokenReply {
	bool is_player_exist = 1;
	string auth_token = 2;
}

enum GameHistoryStatus{
	GAME_HISTORY_STATUS_UNKNOWN = 0;
	GAME_HISTORY_STATUS_OPENED = 1;
	GAME_HISTORY_STATUS_WON = 2;
	GAME_HISTORY_STATUS_LOST = 3;
	GAME_HISTORY_STATUS_HALF_WON = 4;
	GAME_HISTORY_STATUS_HALF_LOST = 5;
	GAME_HISTORY_STATUS_CANCELED = 6;
	GAME_HISTORY_STATUS_CASHOUT = 7;
	GAME_HISTORY_STATUS_DRAW = 8;
	GAME_HISTORY_STATUS_DECLINED = 9;
}